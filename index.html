
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    <script src="index.js" defer></script>
</head>
<body>
    <main class="scoreboard">
        <section class="team">
            <h1>HOME</h1>
            <div class="score" id="score-left" aria-live="polite">0</div>

            <div class="buttons">
                <button data-team="home" data-points="1">+1</button>
                <button data-team="home" data-points="2">+2</button>
                <button data-team="home" data-points="3">+3</button>
            </div>
        </section>

        <section class="team">
            <h1>GUEST</h1>
            <div class="score" id="score-right" aria-live="polite">0</div>

            <div class="buttons">
                <button data-team="guest" data-points="1">+1</button>
                <button data-team="guest" data-points="2">+2</button>
                <button data-team="guest" data-points="3">+3</button>
            </div>
        </section>

        <div class="game-controls">
            <button id="new-game">NEW GAME</button>
        </div>
    </main>
</body>
</html>
